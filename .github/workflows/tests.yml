name: tests
# G7.5 (T61): every push to a branch of this repository gets one run, and so does a pull request from another
# repository. A pull request from one of this repository's own branches starts no jobs: its head was run by its
# push. (A head must never wait for its pull request's run: no such run starts while the pull request conflicts
# with its base.) A tag starts no run: its commit was run on its branch.
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
# A newer push to a branch, or to a pull request, ends that one's older run. A push to main or a release branch has
# a group of its own (the run's id), so it is never ended by another and never waits for one.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')) }}
jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]     # G5.11 (T58): the floor, and the newest
    steps:
      - uses: actions/checkout@v4
      # 3.8 is below the floor: the suite starts the tool with it and sees it stop, having made nothing. The last
      # one named is the `python` the suite runs on.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.8
            ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      # G7.12: green is decided outside the test process (a run that ends early with exit 0 is not green)
      - run: python tests/run_whole.py
  skill-spec:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Every SKILL.md loads in a strict YAML parser and fits the Agent Skills limits
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, json, yaml
          for p in glob.glob("skills/*/SKILL.md"):
              t = open(p, encoding="utf-8").read()
              d = yaml.safe_load(t.split("---", 2)[1])
              assert isinstance(d, dict) and d.get("name") and d.get("description"), p
              assert len(d["name"]) <= 64 and len(d["description"]) <= 1024, (p, len(d["description"]))
              assert len(t.splitlines()) < 500, p
              print("ok", p, len(d["description"]), "chars")
          for p in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"):
              json.load(open(p)); print("ok", p)
          PY
      - name: Agent Skills validator (gh skill publish --dry-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh skill --help >/dev/null 2>&1; then
            echo "::error::this runner's gh has no 'skill' command, so the validator could not run. A check that did not run has not passed."
            exit 1
          fi
          gh skill publish --dry-run
