name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: python tests/test_tardigrade.py -v
  skill-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Every SKILL.md loads in a strict YAML parser and fits the Agent Skills limits
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, json, yaml
          for p in glob.glob("skills/*/SKILL.md"):
              t = open(p, encoding="utf-8").read()
              d = yaml.safe_load(t.split("---", 2)[1])
              assert isinstance(d, dict) and d.get("name") and d.get("description"), p
              assert len(d["name"]) <= 64 and len(d["description"]) <= 1024, (p, len(d["description"]))
              assert len(t.splitlines()) < 500, p
              print("ok", p, len(d["description"]), "chars")
          for p in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"):
              json.load(open(p)); print("ok", p)
          PY
      - name: Agent Skills validator (gh skill publish --dry-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh skill --help >/dev/null 2>&1; then
            echo "::error::this runner's gh has no 'skill' command, so the validator could not run. A check that did not run has not passed."
            exit 1
          fi
          gh skill publish --dry-run
